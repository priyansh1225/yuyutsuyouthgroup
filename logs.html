<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Audit Logs | Yuyutsu Youth Group</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <style>
    .logs-section { max-width: 1100px; margin: 0 auto; padding: 84px 24px; }
    table.log-table { width: 100%; border-collapse: collapse; margin-top: 20px; }
    table.log-table th, table.log-table td {
      padding: 10px 12px;
      text-align: left;
      border-bottom: 1px solid var(--border);
      font-size: 0.85rem;
    }
    table.log-table th { color: var(--orange-soft); }
    .status-ok { color: #6be675; font-weight: 700; }
    .status-fail { color: #ff5c5c; font-weight: 700; }
    .hash-cell { font-family: monospace; font-size: 0.75rem; color: var(--text-soft); }
  </style>
</head>
<body>
  <header class="site-header">
    <nav class="navbar">
      <a href="index.html" class="logo">
        <img src="images/logo.png" alt="Yuyutsu Logo">
        <span class="logo-text">Yuyutsu Youth Group</span>
      </a>
      <ul class="nav-links">
        <li><a href="admin.html">Back to Admin</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <section class="logs-section">
      <span class="section-badge">Security</span>
      <h2 class="section-title" style="margin: 14px 0;">Admin Audit Logs</h2>
      <p class="section-subtitle">Every admin action is recorded and cryptographically chained. Click below to verify the entire log has not been tampered with.</p>

      <button id="verifyBtn" class="btn btn-primary" style="margin-top:16px;">Verify Chain</button>
      <p id="verifyResult" style="margin-top:12px; font-weight:600;"></p>

      <div style="overflow-x:auto;">
        <table class="log-table">
          <thead>
            <tr>
              <th>Time</th>
              <th>User</th>
              <th>Action</th>
              <th>Details</th>
              <th>Hash</th>
              <th>Status</th>
            </tr>
          </thead>
          <tbody id="logsBody"></tbody>
        </table>
      </div>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-client.js"></script>
  <script src="audit.js"></script>
  <script src="logs.js"></script>
</body>
</html>
